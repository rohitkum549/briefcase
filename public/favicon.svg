<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <!--
    The site's own mark, the same one inlined in Header.tsx and Footer.tsx: a
    rounded square with teal chevrons. It replaces a purple lightning bolt left
    over from project scaffolding, which matched nothing in the design system.

    Colours are literal rather than tokens because a favicon renders outside the
    document and inherits nothing. The square follows the browser's colour
    scheme so the mark stays visible in both light and dark tab bars; the teal is
    --accent-brand's light value, which reads on either ground.
  -->
  <style>
    .ground { fill: #1a1a1a }
    @media (prefers-color-scheme: dark) { .ground { fill: #f1f1ec } }
  </style>
  <rect class="ground" x="1" y="1" width="28" height="28" rx="8" />
  <path
    d="M12 10l-4 5 4 5M18 10l4 5-4 5"
    fill="none"
    stroke="#0f766e"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
