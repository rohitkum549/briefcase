<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#050609"
    />

    <!--
      Resolve the theme BEFORE first paint.

      This has to be a blocking inline script. The class was previously set in a
      useLayoutEffect, which cannot run until the entry bundle has downloaded,
      parsed and mounted React — so a visitor who prefers dark got a full white
      page for as long as that took, then a flip. Three hundred milliseconds of
      the wrong colour is the first thing they see.

      Kept deliberately tiny and dependency-free, and it MUST mirror
      getPreferredTheme() in src/providers/theme-context.ts: same storage key,
      same order (stored preference, then OS, then light). If the two disagree,
      React corrects the class after hydration and the flash returns.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rj-portfolio-theme');
          if (stored === 'dark')
            return document.documentElement.classList.add('dark');
          if (stored === 'light') return;
        } catch (e) {
          /* private mode — fall through to the media query */
        }
        if (
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!--
      This metadata is the machine-readable half of the résumé: what a search
      result, a shared link and Google's knowledge graph report. A recruiter who
      reads the search result and then the résumé must see one person. (An
      earlier revision did not: it said "Senior", claimed a stack the project
      does not use, and named the wrong university. See git history.)

      %VITE_*% placeholders are substituted at build time by the htmlEnv plugin
      in vite.config.ts, from the same repository variables the app reads — so
      identity here cannot drift from the rendered site. Everything else (job
      title, stack, education) is content and must stay in step with
      src/services/data/portfolioData.ts by hand.
    -->
    <title>
      %VITE_SITE_NAME% — Full-Stack Engineer | Fintech & Open Banking, React,
      Node.js
    </title>
    <meta
      name="description"
      content="%VITE_SITE_NAME% is a full-stack engineer in Mumbai with 3+ years in fintech and Open Banking. Built Lynqx from scratch — connectivity for 25+ banks and institutions across the US, EU and APAC — in React 19, Next.js, Angular 19, TypeScript, Node.js and PostgreSQL, with Temporal workflows, REST API design and AI-assisted delivery."
    />
    <meta name="author" content="%VITE_SITE_NAME%" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta
      property="og:url"
      content="https://rohitkum549.github.io/briefcase/"
    />
    <link rel="canonical" href="https://rohitkum549.github.io/briefcase/" />
    <!--
      Absolute URLs: scrapers fetch these without a document base, so a relative
      path resolves against their own host and 404s. `summary_large_image` was
      already declared here with no image at all, which is why every shared link
      rendered a blank card. public/og.png is generated from the site's own
      tokens and fonts — see scratchpad/og.mjs.
    -->
    <meta
      property="og:image"
      content="https://rohitkum549.github.io/briefcase/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rohit Kumar Jha — I build the platforms banks connect through."
    />
    <meta
      name="twitter:image"
      content="https://rohitkum549.github.io/briefcase/og.png"
    />
    <meta
      property="og:title"
      content="%VITE_SITE_NAME% — Full-Stack Engineer · Fintech & Open Banking"
    />
    <meta
      property="og:description"
      content="3+ years in fintech and Open Banking. Built Lynqx from scratch — bank connectivity across the US, EU and APAC. React 19 · Next.js · Angular 19 · Node.js · PostgreSQL · Temporal."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="%VITE_SITE_NAME% — Full-Stack Engineer · Fintech & Open Banking"
    />
    <meta
      name="twitter:description"
      content="3+ years in fintech and Open Banking. Built Lynqx from scratch — bank connectivity across the US, EU and APAC. React 19 · Node.js · PostgreSQL · Temporal."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "%VITE_SITE_NAME%",
        "jobTitle": "Full-Stack Engineer",
        "email": "%VITE_CONTACT_EMAIL%",
        "telephone": "%VITE_CONTACT_PHONE%",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "worksFor": {
          "@type": "Organization",
          "name": "Cateina Technologies Pvt Ltd"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Future Institute of Engineering & Management"
        },
        "knowsAbout": [
          "React 19",
          "Next.js",
          "Angular 19",
          "TypeScript",
          "Tailwind CSS",
          "Node.js",
          "Express.js",
          "REST API design",
          "PostgreSQL",
          "Schema design",
          "Open Banking",
          "Bank onboarding",
          "Consent flows",
          "Payment routing",
          "Reconciliation",
          "Temporal",
          "APISIX",
          "Keycloak",
          "Docker",
          "GitLab CI/CD",
          "AI-assisted engineering"
        ],
        "sameAs": ["%VITE_LINKEDIN_URL%", "%VITE_GITHUB_URL%"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
